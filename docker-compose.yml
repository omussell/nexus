services:
  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: nexus
      RABBITMQ_DEFAULT_PASS: nexus
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  croid:
    build:
      context: .
      dockerfile: systems/croid/Dockerfile
    ports:
      - "18080:8080"
    volumes:
      - croid-data:/data
    command: ["-addr", ":8080", "-db", "/data/croid.sqlite3", "-amqp", "amqp://nexus:nexus@rabbitmq:5672", "-amqp-exchange", "croid"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      rabbitmq:
        condition: service_healthy

  nauvis:
    build:
      context: .
      dockerfile: systems/nauvis/Dockerfile
    volumes:
      - nauvis-data:/data
      - ./systems/nauvis/data:/data/in:ro
    command: ["-db", "/data/nauvis.sqlite3", "-in", "/data/in", "-out", "/data/out", "-croid", "http://croid:8080"]
    depends_on:
      - croid

  fulgora:
    build:
      context: .
      dockerfile: systems/fulgora/Dockerfile
    volumes:
      - fulgora-data:/data
    command: ["fetch", "-db", "/data/fulgora.sqlite3", "-root", "/data", "-croid", "http://croid:8080", "ror"]
    depends_on:
      - croid
    restart: "no"

  vulcanus:
    build:
      context: .
      dockerfile: systems/vulcanus/Dockerfile
    volumes:
      - vulcanus-data:/data
    command: ["-rabbitmq", "amqp://nexus:nexus@rabbitmq:5672", "-duckdb", "/data/vulcanus.duckdb", "-match-ror"]
    depends_on:
      croid:
        condition: service_healthy

volumes:
  rabbitmq-data:
  croid-data:
  nauvis-data:
  fulgora-data:
  vulcanus-data:
